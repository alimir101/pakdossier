# PakDossier / Investigator-OS — homelab stack
#
#   docker compose -f deploy/compose.yml --env-file deploy/.env up -d --build
#
# Three services, all on the homelab. Only `app` is public, and only through the
# existing Traefik + cloudflared (wildcard *.liflix.online already lands on Traefik).
# Nothing already running is touched: separate project, separate networks, no host ports.

name: os

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
    restart: unless-stopped
    environment:
      PORT: "8080"
      PAKDB_BROWSER_URL: http://sidecar:8788
      # a real browser is slow: keep this >= the adapter floor
      LOOKUP_TIMEOUT_MS: "90000"
      CACHE_TTL_SECONDS: "604800"
      ALLOWED_ORIGIN: "${PUBLIC_ORIGIN:-https://os.liflix.online}"
      # optional free keys — leave blank to skip a provider
      IPQS_KEY: "${IPQS_KEY:-}"
      VERIPHONE_KEY: "${VERIPHONE_KEY:-}"
      NUMLOOKUPAPI_KEY: "${NUMLOOKUPAPI_KEY:-}"
      ABSTRACTAPI_KEY: "${ABSTRACTAPI_KEY:-}"
      NUMVERIFY_KEY: "${NUMVERIFY_KEY:-}"
    volumes:
      - /srv/cloud/os/cache:/data
    networks: [internal, dokploy-network]
    labels:
      traefik.enable: "true"
      traefik.docker.network: dokploy-network
      # http -> https, same pattern as the existing services
      traefik.http.routers.os-intel-web.rule: Host(`${PUBLIC_HOST:-os.liflix.online}`)
      traefik.http.routers.os-intel-web.entrypoints: web
      traefik.http.routers.os-intel-web.middlewares: redirect-to-https@file
      traefik.http.routers.os-intel-web.service: os-intel-svc
      # https
      traefik.http.routers.os-intel-websecure.rule: Host(`${PUBLIC_HOST:-os.liflix.online}`)
      traefik.http.routers.os-intel-websecure.entrypoints: websecure
      traefik.http.routers.os-intel-websecure.service: os-intel-svc
      traefik.http.routers.os-intel-websecure.tls.certresolver: letsencrypt
      traefik.http.services.os-intel-svc.loadbalancer.server.port: "8080"

  # real browser for captcha-protected public portals; internal only
  obscura:
    image: os-obscura
    build:
      context: .
      dockerfile: Dockerfile.obscura
    restart: unless-stopped
    env_file:
      - /srv/cloud/os/obscura.env
    # --workers 2 matters: single-process mode failed to execute page scripts.
    # --host 0.0.0.0 + the token are required to reach CDP from another container.
    command: ["serve", "--host", "0.0.0.0", "--port", "9222", "--stealth", "--workers", "2"]
    shm_size: 512m
    networks: [internal]

  sidecar:
    image: os-sidecar
    build:
      context: ..
      dockerfile: deploy/Dockerfile.sidecar
    restart: unless-stopped
    env_file:
      - /srv/cloud/os/obscura.env
    environment:
      OBSCURA_HTTP: http://obscura:9222
      PAKDB_SIDECAR_PORT: "8788"
      # one long attempt beats two short ones: the widget needs ~90s here, and the
      # sidecar caches the result, so the *second* call is instant
      PAKDB_ATTEMPTS: "1"
      PAKDB_BUDGET_MS: "140000"
      PAKDB_TOKEN_WAIT_MS: "95000"
      PAKDB_CACHE_MS: "1800000"
    depends_on: [obscura]
    networks: [internal]

networks:
  # our own private network (bridge, not reachable from outside)
  internal:
    driver: bridge
  # Traefik's network, so the docker provider can route us
  dokploy-network:
    external: true
